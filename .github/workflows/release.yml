name: Release

# Publish a Foundry-installable release whenever a version tag is pushed.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set release URLs in module.json
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("module.json", "utf8"));
            const tag = process.env.TAG;
            const repo = process.env.REPO;
            m.version = tag.replace(/^v/, "");
            m.manifest = `https://github.com/${repo}/releases/latest/download/module.json`;
            m.download = `https://github.com/${repo}/releases/download/${tag}/module.zip`;
            fs.writeFileSync("module.json", JSON.stringify(m, null, 2) + "\n");
          '
          echo "----- module.json -----"
          cat module.json

      - name: Build module.zip
        run: |
          zip -r module.zip \
            module.json \
            scripts \
            templates \
            styles \
            lang \
            README.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            module.json module.zip \
            --title "$TAG" \
            --notes "DC20 Mobile $TAG. Install in Foundry via the manifest URL: https://github.com/${{ github.repository }}/releases/latest/download/module.json"
